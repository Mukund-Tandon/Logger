version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    networks:
      - default
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  app:
    build: .
    container_name: logingestor
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      - clickhouse
    networks:
      - default
      - kafka-network
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}

volumes:
  clickhouse_data:

networks:
  default:
  kafka-network:
    external: true
    name: kafka-network