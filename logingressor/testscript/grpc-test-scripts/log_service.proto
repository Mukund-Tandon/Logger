syntax = "proto3";

package logservice;

option go_package = "logingrestor/pkg/proto";

service LogService {
  rpc SendLog(LogRequest) returns (LogResponse) {}
}

// Matches the models.Log structure exactly
message LogRequest {
  string timestamp = 1;
  string level = 2; 
  string message = 3;
  string resource_id = 4;
}

message LogResponse {
  bool success = 1;
  string message = 2;
}

message LogBatchRequest {
  repeated LogRequest logs = 1;
}